name: CI (Go / Gin)

on:
  pull_request:
    branches: ['master']
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:

env:
  GO_VERSION: '1.22'

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      statuses: write
      checks: write

    steps:
      # 1) Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Setup Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # 3) Download dependencies
      - name: Download dependencies
        run: go mod download

      # 4) Verify formatting
      - name: Verify formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not properly formatted:"
            gofmt -l .
            exit 1
          fi

      # 5) Run go vet
      - name: Run go vet
        run: go vet ./...

      # 6) Run tests with coverage
      - name: Run tests with coverage
        env:
          PORT: 8080
          DETECTIVE_MANAGER_URL: http://localhost:8087/api/detective-manager
        run: |
          go test ./internal/... ./pkg/... ./tests/integration/... -coverprofile=coverage.out

          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')

          echo "Total coverage: $COVERAGE%"

          MIN_COVERAGE=80

          COVERAGE_INT=${COVERAGE%.*}

          if [ "$COVERAGE_INT" -lt "$MIN_COVERAGE" ]; then
            echo "Coverage is below ${MIN_COVERAGE}%"
            exit 1
          fi

      # 7) Build application
      - name: Build application
        run: go run scripts.go build

      # 8) Validate Docker build
      - name: Build Docker image
        run: docker build -t gateway-microcontroller:test .