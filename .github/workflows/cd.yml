name: CD (Deploy Gateway)

on:
  push:
    branches: ['master']
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}

  SERVICE: gateway-microcontroller

  IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/tp-hogar-seguro/gateway-microcontroller

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
            ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push \
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1 \
            --concurrency 20 \
            --cpu-throttling \
            --set-env-vars \
              DETECTOR_SERVICE_URL=${{ secrets.DETECTOR_SERVICE_URL }},\
              AUTH_SERVICE_URL=${{ secrets.AUTH_SERVICE_URL }},\
              GIN_MODE=release,\
              SERVER_CERT_PEM="${{ secrets.SERVER_CERT_PEM }}",\
              SERVER_KEY_PEM="${{ secrets.SERVER_KEY_PEM }}",\
              CLIENT_CA_PEM="${{ secrets.CLIENT_CA_PEM }}"