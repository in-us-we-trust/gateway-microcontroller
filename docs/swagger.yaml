basePath: /
definitions:
  apierror.APIError:
    properties:
      code:
        example: DTE-001
        type: string
      detail:
        example: The image field is required
        type: string
      instance:
        example: /api/v1/events
        type: string
      status:
        example: 400
        type: integer
      title:
        example: Bad Request
        type: string
      type:
        example: about:blank
        type: string
    type: object
  domain.DeviceData:
    properties:
      city:
        example: San Miguel
        type: string
      detectionThreshold:
        example: 85
        type: number
      firmwareVersion:
        example: v1.3.7
        type: string
      id:
        example: 9df4a749-3ec2-43b9-bc42-35d2b6b5b173
        type: string
      lastBoot:
        example: "2026-06-27T17:45:00Z"
        type: string
      lastSeen:
        example: "2026-06-27T18:30:00Z"
        type: string
      location:
        example: Main Entrance
        type: string
      serialNumber:
        example: ESP32-000001
        type: string
      status:
        example: UNCLAIMED
        type: string
      uptime:
        example: 2700
        type: integer
    type: object
  domain.DeviceRequest:
    properties:
      city:
        example: San Miguel
        type: string
      detectionThreshold:
        example: 85
        type: number
      firmwareVersion:
        example: v1.3.7
        type: string
      lastBoot:
        example: "2026-06-27T17:45:00Z"
        type: string
      lastSeen:
        example: "2026-06-27T18:30:00Z"
        type: string
      location:
        example: Front door
        type: string
      serialNumber:
        example: ESP32-000001
        type: string
    required:
    - lastBoot
    - lastSeen
    - serialNumber
    type: object
  domain.DeviceResponse:
    properties:
      data:
        $ref: '#/definitions/domain.DeviceData'
    type: object
  domain.EventData:
    properties:
      deviceId:
        example: 9df4a749-3ec2-43b9-bc42-35d2b6b5b173
        type: string
      eventId:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      eventType:
        example: motion
        type: string
      faceRecognition:
        $ref: '#/definitions/domain.FaceRecognition'
      imageUrl:
        example: https://storage.example.com/events/3fa85f64-5717-4562-b3fc-2c963f66afa6.jpg
        type: string
      isIntruder:
        example: true
        type: boolean
      timestamp:
        example: "2026-06-28T21:19:59.466Z"
        type: string
    type: object
  domain.EventRequest:
    properties:
      image:
        example: /9j/4AAQSkZJRgABAQAAAQABAAD...
        type: string
      type:
        allOf:
        - $ref: '#/definitions/domain.EventType'
        enum:
        - bell
        - motion
        example: motion
    required:
    - image
    - type
    type: object
  domain.EventResponse:
    properties:
      data:
        $ref: '#/definitions/domain.EventData'
    type: object
  domain.EventType:
    enum:
    - bell
    - motion
    type: string
    x-enum-varnames:
    - EventTypeBell
    - EventTypeMotion
  domain.FaceRecognition:
    properties:
      closest_match:
        example: John Doe
        type: string
      detector_backend:
        example: retinaface
        type: string
      distance:
        example: 0.82
        type: number
      distance_metric:
        example: cosine
        type: string
      known:
        example: false
        type: boolean
      model_name:
        example: Facenet512
        type: string
      threshold:
        example: 0.6
        type: number
    type: object
host: localhost:8080
info:
  contact: {}
  description: IoT gateway for the Secure Home project — routes microcontroller events
    to the detection service.
  title: Secure Home Gateway API
  version: "1.0"
paths:
  /api/v1/events:
    post:
      consumes:
      - application/json
      description: Receives a security event from an IoT microcontroller and propagates
        it to the detection service
      parameters:
      - description: Should send certs and extracted from GCP load balancer (only
          if mtls enabled)
        in: header
        name: X-Client-Cert-Subject
        type: string
      - description: Device identifier (only if mtls disabled)
        in: header
        name: X-Device-ID
        type: string
      - description: Event payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.EventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.EventResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.APIError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/apierror.APIError'
      security:
      - BearerAuth: []
      summary: Report a security event
      tags:
      - events
  /devices:
    post:
      consumes:
      - application/json
      description: Registers a new IoT device with the devices controller
      parameters:
      - description: Should send certs and extracted from GCP load balancer (only
          if mtls enabled)
        in: header
        name: X-Client-Cert-Subject
        type: string
      - description: Device identifier (only if mtls disabled)
        in: header
        name: X-Device-ID
        type: string
      - description: Device registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.DeviceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.DeviceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.APIError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/apierror.APIError'
      security:
      - BearerAuth: []
      summary: Register a new device
      tags:
      - devices
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
